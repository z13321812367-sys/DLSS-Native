<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">DLSS Native</title><desc id="desc">Native RTX video processing pipeline from decode to output.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a0d"/><stop offset="0.52" stop-color="#0b1117"/><stop offset="1" stop-color="#080b10"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#79f5a8"/><stop offset="0.55" stop-color="#72e6ff"/><stop offset="1" stop-color="#a69bff"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><rect width="1200" height="520" rx="28" fill="url(#bg)"/><rect width="1200" height="520" rx="28" fill="url(#grid)"/><circle cx="1010" cy="94" r="220" fill="#72e6ff" opacity=".045"/><circle cx="174" cy="420" r="250" fill="#79f5a8" opacity=".035"/><g transform="translate(72 62)"><g transform="translate(0 0)"><path d="M26 0H84L110 26V84L84 110H26L0 84V26Z" fill="#0f171d" stroke="url(#accent)" stroke-width="3"/><path d="M27 78V31h13l31 32V31h13v47H71L40 46v32Z" fill="url(#accent)"/><rect x="-17" y="36" width="12" height="38" rx="3" fill="#79f5a8" opacity=".88"/><rect x="115" y="36" width="12" height="38" rx="3" fill="#72e6ff" opacity=".9"/></g><text x="150" y="48" fill="#f5f8fb" font-size="52" font-weight="800" letter-spacing="-2" font-family="Inter,Segoe UI,Arial,sans-serif">DLSS NATIVE</text><text x="152" y="82" fill="#91a0ad" font-size="18" font-weight="600" letter-spacing="2.4" font-family="Inter,Segoe UI,Arial,sans-serif">RTX VIDEO, END TO END</text></g><g transform="translate(74 240)" font-family="Inter,Segoe UI,Arial,sans-serif"><text x="0" y="0" fill="#f4f7fa" font-size="26" font-weight="700">One GPU path from decoded frame to encoded output.</text><text x="0" y="36" fill="#92a0ad" font-size="17">Super Resolution · Frame Generation · HDR-aware processing · D3D12</text></g><g transform="translate(74 344)" font-family="Inter,Segoe UI,Arial,sans-serif"><path d="M0 56H1010" stroke="#24313b" stroke-width="2"/><path d="M98 56H940" stroke="url(#accent)" stroke-width="3" opacity=".72"/><g fill="#0d141a" stroke="#2b3944"><rect x="0" y="16" width="154" height="80" rx="16"/><rect x="210" y="16" width="154" height="80" rx="16"/><rect x="420" y="16" width="154" height="80" rx="16"/><rect x="630" y="16" width="154" height="80" rx="16"/><rect x="840" y="16" width="154" height="80" rx="16"/></g><g fill="#f2f6f9" font-size="16" font-weight="700" text-anchor="middle"><text x="77" y="51">DECODE</text><text x="287" y="51">D3D12</text><text x="497" y="51">DLSS SR</text><text x="707" y="51">FRAME GEN</text><text x="917" y="51">OUTPUT</text></g><g fill="#7f8d99" font-size="12" text-anchor="middle"><text x="77" y="74">PTS + precision</text><text x="287" y="74">shared surfaces</text><text x="497" y="74">neural upscale</text><text x="707" y="74">timeline aware</text><text x="917" y="74">encode · mux</text></g><g fill="#79f5a8" filter="url(#glow)"><circle cx="178" cy="56" r="5"/><circle cx="388" cy="56" r="5"/><circle cx="598" cy="56" r="5"/><circle cx="808" cy="56" r="5"/></g></g><text x="1124" y="493" text-anchor="end" fill="#52606b" font-size="12" font-family="Inter,Segoe UI,Arial,sans-serif">DLSS Native · independent project</text></svg>