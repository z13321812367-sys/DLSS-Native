<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title"><title id="title">DLSS Native architecture</title><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#79f5a8"/><stop offset=".55" stop-color="#72e6ff"/><stop offset="1" stop-color="#a69bff"/></linearGradient></defs><rect width="1200" height="430" rx="28" fill="#0a0f14"/><text x="64" y="68" fill="#f4f7fa" font-size="30" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif">Architecture</text><text x="64" y="98" fill="#8795a1" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">A sequence-scoped D3D12 path with media timing kept explicit.</text><g transform="translate(64 154)" font-family="Inter,Segoe UI,Arial,sans-serif"><g fill="#111922" stroke="#293641"><rect x="0" y="0" width="164" height="126" rx="18"/><rect x="194" y="0" width="164" height="126" rx="18"/><rect x="388" y="0" width="164" height="126" rx="18"/><rect x="582" y="0" width="164" height="126" rx="18"/><rect x="776" y="0" width="164" height="126" rx="18"/><rect x="970" y="0" width="164" height="126" rx="18"/></g><g fill="#f2f6f9" text-anchor="middle"><text x="82" y="48" font-size="17" font-weight="700">Decode</text><text x="276" y="48" font-size="17" font-weight="700">RTX Context</text><text x="470" y="48" font-size="17" font-weight="700">DLSS SR</text><text x="664" y="48" font-size="17" font-weight="700">HDR</text><text x="858" y="48" font-size="17" font-weight="700">Frame Gen</text><text x="1052" y="48" font-size="17" font-weight="700">Output</text></g><g fill="#82909c" text-anchor="middle" font-size="12"><text x="82" y="74">PTS · precision</text><text x="276" y="74">D3D12 · NVOF</text><text x="470" y="74">shared surface</text><text x="664" y="74">signal contract</text><text x="858" y="74">timeline</text><text x="1052" y="74">encode · mux</text></g><path d="M164 63H194M358 63H388M552 63H582M746 63H776M940 63H970" stroke="url(#a)" stroke-width="4" stroke-linecap="round"/><g fill="#79f5a8"><circle cx="179" cy="63" r="5"/><circle cx="373" cy="63" r="5"/><circle cx="567" cy="63" r="5"/><circle cx="761" cy="63" r="5"/><circle cx="955" cy="63" r="5"/></g></g><g transform="translate(64 330)" font-family="Inter,Segoe UI,Arial,sans-serif"><text x="0" y="0" fill="#72e6ff" font-size="12" font-weight="700" letter-spacing="1.6">MEDIA TRUTH</text><text x="0" y="26" fill="#a4b0ba" font-size="14">Source PTS drives scheduling.</text><text x="300" y="0" fill="#79f5a8" font-size="12" font-weight="700" letter-spacing="1.6">GPU OWNERSHIP</text><text x="300" y="26" fill="#a4b0ba" font-size="14">Shared surfaces stay in one context.</text><text x="650" y="0" fill="#a69bff" font-size="12" font-weight="700" letter-spacing="1.6">FILE BOUNDARY</text><text x="650" y="26" fill="#a4b0ba" font-size="14">Reorder, mux and EOS are verified.</text></g></svg>